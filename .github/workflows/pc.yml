name: native-c

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release or draft tag for Windows package startup smoke
        required: false
        type: string

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Fetch PsyZ and SDL
        run: |
          git submodule update --init third_party/psyz
          git -C third_party/psyz submodule update --init external/SDL
      - name: Build the native target
        run: |
          cmake -S . -B build -DBUILD_TESTING=ON -DPE_MODS=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure --no-tests=error

  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PSYZ_HEADLESS: '1'
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libcurl4-openssl-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libdecor-0-dev libvulkan-dev libxtst-dev libxinerama-dev wayland-protocols libdrm-dev libgbm-dev libgles2-mesa-dev
      - name: Fetch PsyZ and SDL
        run: |
          git submodule update --init third_party/psyz
          git -C third_party/psyz submodule update --init external/SDL
      - name: Build and verify Linux x86-64
        run: |
          cmake -S . -B build -G Ninja -DBUILD_TESTING=ON -DPE_MODS=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build --parallel 4
          ./build/parasite-eve-pc --help
          ctest --test-dir build --output-on-failure --no-tests=error --output-junit linux-source-only.xml -R '^(original-game-(akao-layout|math|gte|animation|transforms|projection|hierarchy|input-rules|pools|nodes|queue|expression|contact|movement|movie-audio-lock-order|spu-(mix-headroom|pitch-modulation|noise|live-adsr|register-serialization|hardware-reference))|host-settings|hd-mod-download-safety|original-game-save-safety|mod-settings-save-safety|pe-mod-frequency)$'
          ctest --test-dir build --output-on-failure --no-tests=error -R "^(original-m273-landing-cycle|original-callback-allocation-failure|original-m273-effect-pointers|original-menu-call-abi|original-game-pulled-sprite|host-crash-report|mod-crash-save-tail|mod-preserve-save-tail|mod-save-records|mod-save-registration-bounds|mod-rebalance-(vanilla|saved-vanilla|scoped|poison)|mod-atb|mod-combine|mod-panacea-off|mod-pe-(vanilla|saved-vanilla|cost|actor)|mod-inventory|mod-inventory-menu)$"
          ctest --test-dir build --output-on-failure --no-tests=error --output-junit mod-features.xml -R "^mod-(loot|junk-counter|armor-effect-display|catalog-rules|catalog-menu|requisition|smoke|skin-bounds|collection|model|present|stage)$"
          python3 - <<'PYTEST'
          import xml.etree.ElementTree as E
          r = E.parse('build/linux-source-only.xml')
          assert len(r.findall('.//testcase')) == 26
          assert not any(r.findall('.//' + tag) for tag in ['skipped', 'failure', 'error'])
          r = E.parse('build/mod-features.xml')
          assert len(r.findall('.//testcase')) == 12
          assert not any(r.findall('.//' + tag) for tag in ['skipped', 'failure', 'error'])
          PYTEST
      - name: Verify and build save editor
        env:
          PE_MOD_SAVE_ORACLE: ${{ github.workspace }}/build/mods/test-editor-mod-save
        run: |
          cargo test --manifest-path save-editor/Cargo.toml --locked
          cargo build --manifest-path save-editor/Cargo.toml --locked --release
      - name: Package Linux x86-64
        run: |
          stage=package/Parasite-Eve-linux-x86_64
          mkdir -p "$stage/docs/images" "$stage/licenses" "$stage/mods"
          cp build/parasite-eve-pc README.md CHANGELOG.md LICENSE.md THIRD_PARTY_NOTICES.md "$stage/"
          cp docs/CODE_ORGANIZATION.md "$stage/docs/"
          cp mods/README.md "$stage/mods/"
          cp docs/images/gameplay.png "$stage/docs/images/"
          python3 - <<'PYLICENSE'
          from pathlib import Path
          import shutil
          dest = Path('package/Parasite-Eve-linux-x86_64/licenses')
          for path in Path('third_party/psyz').rglob('*'):
              if path.is_file() and path.name.lower().startswith(('license', 'copying', 'notice', 'copyright')) and '.git' not in path.parts:
                  target = dest / path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(path, target)
          PYLICENSE
          ldd build/parasite-eve-pc > "$stage/runtime-dependencies.txt"
          git rev-parse HEAD > "$stage/source-commit.txt"
          tar -czf Parasite-Eve-0.8-linux-x86_64.tar.gz -C package Parasite-Eve-linux-x86_64
          sha256sum Parasite-Eve-0.8-linux-x86_64.tar.gz > linux-x86_64-sha256.txt
          editor=package/Parasite-Eve-Save-Editor-0.8-linux-x86_64
          mkdir -p "$editor/licenses"
          cp save-editor/target/release/pe-save-editor LICENSE.md "$editor/"
          python3 - <<'PYEDITORLICENSE'
          from pathlib import Path
          import os, shutil
          registry = Path(os.environ.get('CARGO_HOME', str(Path.home() / '.cargo'))) / 'registry/src'
          dest = Path('package/Parasite-Eve-Save-Editor-0.8-linux-x86_64/licenses')
          for index in registry.iterdir():
              for crate in index.iterdir():
                  for path in crate.rglob('*'):
                      if path.is_file() and path.name.lower().startswith(('license', 'copying', 'notice', 'copyright')):
                          target = dest / crate.name / path.relative_to(crate)
                          target.parent.mkdir(parents=True, exist_ok=True)
                          shutil.copy2(path, target)
          PYEDITORLICENSE
          tar -czf Parasite-Eve-Save-Editor-0.8-linux-x86_64.tar.gz -C package Parasite-Eve-Save-Editor-0.8-linux-x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-x86_64-package
          path: |
            Parasite-Eve-0.8-linux-x86_64.tar.gz
            Parasite-Eve-Save-Editor-0.8-linux-x86_64.tar.gz
            linux-x86_64-sha256.txt
            build/linux-source-only.xml

  windows-source-only:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    env:
      PSYZ_HEADLESS: '1'
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gdb
            mingw-w64-ucrt-x86_64-python
      - name: Fetch PsyZ and SDL
        run: |
          git submodule update --init third_party/psyz
          git -C third_party/psyz submodule update --init external/SDL
      - name: Build the native Windows game and test executables
        run: |
          cmake -S . -B build -G Ninja -DBUILD_TESTING=ON -DPE_MODS=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build --target test-crash-report --parallel 2
          ctest --test-dir build --output-on-failure --no-tests=error -R '^host-crash-report$'
          cmake --build build --parallel 2
      - name: Require a self-contained Windows executable
        run: |
          python3 tests/windows_imports.py build/parasite-eve-pc.exe build/windows-imports.txt
      - name: Run source-only Windows runtime checks (no retail images)
        run: |
          ./build/parasite-eve-pc.exe --help
          ctest --test-dir build --output-on-failure --no-tests=error --output-junit windows-source-only.xml -R '^(original-game-(akao-layout|math|gte|animation|transforms|projection|hierarchy|input-rules|pools|nodes|queue|expression|contact|movement|movie-audio-lock-order|spu-(mix-headroom|pitch-modulation|noise|live-adsr|register-serialization|hardware-reference))|host-settings|hd-mod-download-safety|original-game-save-safety|mod-settings-save-safety|pe-mod-frequency)$'
          ctest --test-dir build --output-on-failure --no-tests=error -R "^(original-m273-landing-cycle|original-callback-allocation-failure|original-m273-effect-pointers|original-menu-call-abi|original-game-pulled-sprite|host-crash-report|mod-crash-save-tail|mod-preserve-save-tail|mod-save-records|mod-save-registration-bounds|mod-rebalance-(vanilla|saved-vanilla|scoped|poison)|mod-atb|mod-combine|mod-panacea-off|mod-pe-(vanilla|saved-vanilla|cost|actor)|mod-inventory|mod-inventory-menu)$"
          ctest --test-dir build --output-on-failure --no-tests=error --output-junit mod-features.xml -R "^mod-(loot|junk-counter|armor-effect-display|catalog-rules|catalog-menu|requisition|smoke|skin-bounds|collection|model|present|stage)$"
      - name: Stress D3D12 descriptor batches without a visible window
        env:
          SDL_GPU_DRIVER: direct3d12
        run: ctest --test-dir build --output-on-failure --no-tests=error -R '^original-gpu-(descriptor-batches|frame-interpolation|resource-(upload|readback|reset|resize|swapchain-resize))$'
      - name: Require all selected source-only cases to execute
        shell: pwsh
        run: |
          [xml]$report = Get-Content build/windows-source-only.xml
          $cases = $report.SelectNodes('//testcase')
          $incomplete = $report.SelectNodes('//testcase/skipped | //testcase/failure | //testcase/error')
          if ($cases.Count -ne 26 -or $incomplete.Count -ne 0) { throw 'Expected 26 executed source-only cases without failures or skips' }
          [xml]$features = Get-Content build/mod-features.xml
          if ($features.SelectNodes('//testcase').Count -ne 12 -or $features.SelectNodes('//testcase/skipped | //testcase/failure | //testcase/error').Count -ne 0) { throw 'Expected all 12 mod feature regressions without failures or skips' }
      - name: Build and test Windows save editor
        shell: pwsh
        env:
          PE_MOD_SAVE_ORACLE: ${{ github.workspace }}/build/mods/test-editor-mod-save.exe
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo test --manifest-path save-editor/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { throw 'Save editor regressions failed' }
          cargo build --manifest-path save-editor/Cargo.toml --locked --release
          if ($LASTEXITCODE -ne 0) { throw 'Save editor build failed' }
      - name: Require a self-contained Windows save editor
        run: python3 tests/windows_imports.py save-editor/target/release/pe-save-editor.exe build/windows-editor-imports.txt
      - name: Package Windows game and save editor
        shell: pwsh
        run: |
          $game = 'package/Parasite-Eve-0.8-windows-x86_64'
          $editor = 'package/Parasite-Eve-Save-Editor-0.8-windows-x86_64'
          New-Item -ItemType Directory -Force "$game/docs/images", "$game/mods", "$game/licenses", $editor | Out-Null
          Copy-Item build/parasite-eve-pc.exe, README.md, CHANGELOG.md, LICENSE.md, THIRD_PARTY_NOTICES.md $game
          Copy-Item docs/images/gameplay.png "$game/docs/images/"
          Copy-Item docs/CODE_ORGANIZATION.md "$game/docs/"
          Copy-Item mods/README.md "$game/mods/"
          Get-ChildItem third_party/psyz -Recurse -File | Where-Object { $_.Name -match '^(LICENSE|COPYING|NOTICE|COPYRIGHT)' -and $_.FullName -notmatch '[\\/]\.git[\\/]' } | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath((Get-Location).Path, $_.FullName)
            $target = Join-Path "$game/licenses" $relative
            New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
            Copy-Item $_.FullName $target
          }
          git rev-parse HEAD | Set-Content "$game/source-commit.txt"
          Copy-Item save-editor/target/release/pe-save-editor.exe, LICENSE.md $editor
          $registry = Join-Path $env:USERPROFILE '.cargo/registry/src'
          Get-ChildItem $registry -Recurse -File | Where-Object { $_.Name -match '^(LICENSE|COPYING|NOTICE|COPYRIGHT)' } | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath($registry, $_.FullName)
            $target = Join-Path "$editor/licenses" $relative
            New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
            Copy-Item $_.FullName $target
          }
          'Open pe-save-editor.exe to edit a backup of your save. Optional: select your North American disc image for item data. The game must be closed while replacing saves.' | Set-Content "$editor/Read me.txt"
          Compress-Archive -Path $game -DestinationPath Parasite-Eve-0.8-windows-x86_64-experimental.zip
          Compress-Archive -Path $editor -DestinationPath Parasite-Eve-Save-Editor-0.8-windows-x86_64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-packages
          path: |
            Parasite-Eve-0.8-windows-x86_64-experimental.zip
            Parasite-Eve-Save-Editor-0.8-windows-x86_64.zip
      - name: Diagnose native Windows crash handler failures
        if: failure()
        run: |
          mkdir -p build/crash-diagnostics
          gdb --batch -q -ex 'set pagination off' -ex 'handle SIGSEGV nostop noprint pass' -ex 'run --child segv' -ex 'thread apply all bt 30' -ex 'info registers' --args ./build/test-crash-report.exe > build/crash-diagnostics/debugger.log 2>&1 || true
          cat build/crash-diagnostics/debugger.log
      - name: Capture settings thread stacks after a runtime failure
        if: failure()
        run: |
          export PE_TEST_GDB="$(cygpath -w "$(command -v gdb)")"
          python - <<'PY'
          from pathlib import Path
          import json, os, subprocess, time
          executable = Path('build/test-host-settings.exe').resolve()
          if not executable.exists():
              raise SystemExit(0)
          out = Path('build/settings-diagnostics')
          out.mkdir(exist_ok=True)
          with (out / 'run.log').open('w') as log:
              process = subprocess.Popen([str(executable), str((out / 'evidence').resolve())], stdout=log, stderr=subprocess.STDOUT)
              try:
                  deadline = time.monotonic() + 8
                  while process.poll() is None and time.monotonic() < deadline:
                      time.sleep(0.2)
                  if process.poll() is None:
                      with (out / 'threads.log').open('w') as trace:
                          subprocess.run([os.environ['PE_TEST_GDB'], '--batch', '-q', str(executable), '-p', str(process.pid), '-ex', 'set pagination off', '-ex', 'set print frame-arguments none', '-ex', 'thread apply all bt 20', '-ex', 'thread 1', '-ex', 'frame apply all -c info locals', '-ex', 'detach'], stdout=trace, stderr=subprocess.STDOUT, timeout=20, check=True)
              finally:
                  if process.poll() is None:
                      process.kill()
                  process.wait(timeout=5)
                  (out / 'process.json').write_text(json.dumps({'pid': process.pid, 'exit': process.returncode, 'scope': 'Synthetic settings diagnostics only; does not override the failed CTest result.'}, indent=2))
          PY
      - name: Preserve source-only diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-source-only-evidence
          path: |
            build/windows-source-only.xml
            build/test-crash-report.exe
            build/crash-diagnostics
            build/pe-crash-test-*/logs
            build/Testing/Temporary/LastTest.log
            build/settings-diagnostics/*.log
            build/settings-diagnostics/process.json

  windows-package-startup:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: windows-latest
    timeout-minutes: 5
    # GitHub draft visibility requires push access. This job has no checkout.
    permissions:
      contents: write
    steps:
      - name: Check downloaded release package startup (no retail images)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern 'Parasite-Eve-*-windows-x86_64-experimental.zip' --dir package-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          $archives = @(Get-ChildItem package-smoke -Filter '*.zip')
          if ($archives.Count -ne 1) { throw 'Expected one Windows archive' }
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          $matchingReleases = @($releases | Where-Object tag_name -EQ $env:RELEASE_TAG)
          if ($matchingReleases.Count -ne 1) { throw 'Expected one matching release or draft' }
          $release = $matchingReleases[0]
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata request failed' }
          $asset = @($release.assets | Where-Object name -EQ $archives[0].Name)
          if ($asset.Count -ne 1) { throw 'Release asset metadata missing' }
          $digest = (Get-FileHash $archives[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($asset[0].digest -ne "sha256:$digest") { throw 'Downloaded archive digest mismatch' }
          Expand-Archive $archives[0].FullName package-smoke/unpacked
          $executables = @(Get-ChildItem package-smoke/unpacked -Recurse -Filter parasite-eve-pc.exe)
          if ($executables.Count -ne 1) { throw 'Expected one game executable' }
          $help = & $executables[0].FullName --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $help -notmatch 'Usage:' -or $help -notmatch '--disc2') { throw 'Packaged Windows executable failed startup smoke' }
          $help | Set-Content package-smoke/help.txt
          @{ scope = 'Windows package startup only; no retail gameplay/GPU/audio validation'; asset = $archives[0].Name; archive_sha256 = $digest; executable_sha256 = (Get-FileHash $executables[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() } | ConvertTo-Json | Set-Content package-smoke/verification.json
      - name: Check downloaded save editor startup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern 'Parasite-Eve-Save-Editor-*-windows-x86_64.zip' --dir editor-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Editor download failed' }
          $archives = @(Get-ChildItem editor-smoke -Filter '*.zip')
          if ($archives.Count -ne 1) { throw 'Expected one editor archive' }
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Editor release metadata request failed' }
          $release = @($releases | Where-Object tag_name -EQ $env:RELEASE_TAG)
          if ($release.Count -ne 1) { throw 'Expected one editor release' }
          $asset = @($release[0].assets | Where-Object name -EQ $archives[0].Name)
          $digest = (Get-FileHash $archives[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($asset.Count -ne 1 -or $asset[0].digest -ne "sha256:$digest") { throw 'Editor archive digest mismatch' }
          Expand-Archive $archives[0].FullName editor-smoke/unpacked
          $executables = @(Get-ChildItem editor-smoke/unpacked -Recurse -Filter pe-save-editor.exe)
          if ($executables.Count -ne 1) { throw 'Expected one editor executable' }
          $help = & $executables[0].FullName --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $help -notmatch 'Usage:' -or $help -notmatch 'inspect') { throw 'Editor CLI startup failed' }
          $help | Set-Content editor-smoke/help.txt
          @{ scope = 'Windows editor CLI startup only; GUI and editing unverified'; archive_sha256 = $digest; executable_sha256 = (Get-FileHash $executables[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() } | ConvertTo-Json | Set-Content editor-smoke/verification.json
      - name: Preserve exact package startup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-package-startup-evidence
          path: |
            package-smoke/help.txt
            package-smoke/verification.json
            editor-smoke/help.txt
            editor-smoke/verification.json
