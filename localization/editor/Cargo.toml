[package]
name = "pe-translation-editor"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "pe-translation-editor"
description = "Standalone dialogue translation editor for Parasite Eve"

[lib]
name = "pe_translation_editor"
path = "src/lib.rs"

[[bin]]
name = "pe-translation-editor"
path = "src/main.rs"

[dependencies]
caseless = "0.2"
crc32fast = "1"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
flate2 = "1"
freetype-rs = { version = "0.38", features = ["bundled"] }
indexmap = "2"
regex = "1"
rfd = "0.16"
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
time = { version = "0.3", features = ["local-offset"] }
unicode-normalization = "0.1"
zip = { version = "2", default-features = false, features = ["deflate", "time"] }

[profile.release]
opt-level = 3
strip = true
