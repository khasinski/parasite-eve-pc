# freetype-sys compiles its bundled libpng against zlib.h but does not ship it. Linux, macOS and
# mingw provide one; MSVC needs these headers on its INCLUDE path. libz-sys supplies the library.
[env]
INCLUDE = { value = "vendor/zlib", relative = true }

# A local mingw-LLVM build otherwise needs libunwind.dll beside the executable.
[target.x86_64-pc-windows-gnullvm]
rustflags = ["-C", "target-feature=+crt-static"]
